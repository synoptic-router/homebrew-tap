name: Bump synoptic formula

# Tracks the synoptic npm package: reads the latest registry version, updates
# url + sha256, verifies with a real brew install + test, then lands.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pin (default: latest on npm)"
        required: false
        default: ""

jobs:
  bump:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version + sha256 from npm
        id: npm
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(npm view synoptic version)
          fi
          TARBALL="https://registry.npmjs.org/synoptic/-/synoptic-${VERSION}.tgz"
          SHA=$(curl -fsSL "$TARBALL" | shasum -a 256 | cut -d' ' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: |
          python3 - "$GITHUB_WORKSPACE/Formula/synoptic.rb" "${{ steps.npm.outputs.tarball }}" "${{ steps.npm.outputs.sha }}" <<'EOF'
          import re, sys
          path, tarball, sha = sys.argv[1], sys.argv[2], sys.argv[3]
          s = open(path).read()
          s = re.sub(r'^\s*url ".*"$', f'  url "{tarball}"', s, flags=re.M)
          s = re.sub(r'^\s*sha256 ".*"$', f'  sha256 "{sha}"', s, flags=re.M)
          open(path, "w").write(s)
          EOF
          git diff Formula/synoptic.rb

      - name: Verify install
        run: |
          brew tap "$GITHUB_REPOSITORY"
          brew install --build-from-source synoptic-router/tap/synoptic
          brew test synoptic-router/tap/synoptic

      - name: Land
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/synoptic.rb
          git commit -m "synoptic ${{ steps.npm.outputs.version }}" || echo "nothing to land"
          git push
